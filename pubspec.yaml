name: tt_sport_app
description: Arapça/Türkçe destekli Spor & Fitness + Mağaza mobil uygulaması
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3
  flutter_secure_storage: ^9.0.0

  # Routing
  go_router: ^14.2.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # UI / Charts
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.0

  # Utils
  shared_preferences: ^2.2.3
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - .env
